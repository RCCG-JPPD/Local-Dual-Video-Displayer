<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Browser Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }

    #web-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #web-frame {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      display: inline-flex; /* webview needs an explicit display */
    }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 20px;
    }

    #preview-canvas {
      display: none;
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
  </style>
</head>
<body>
  <div id="web-container">
    <div id="placeholder">Waiting for a web page…</div>
    <webview id="web-frame" allowpopups></webview>
  </div>

  <!-- Hidden canvas for preview rendering -->
  <canvas id="preview-canvas"></canvas>

  <script>
    // electronAPI is a preload global (contextBridge) — don't redeclare it.

    const webFrame = document.getElementById('web-frame'); // <webview>
    const webContainer = document.getElementById('web-container');
    const previewCanvas = document.getElementById('preview-canvas');
    const placeholder = document.getElementById('placeholder');

    let currentUrl = '';
    let updatePreviewInterval;

    // ════════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ════════════════════════════════════════════════════════════════

    function initialize() {
      console.log('Web browser display initialized');
      setupPreviewCanvas();

      // Listen for URL updates from controller
      electronAPI.onWebUrlChange((url) => {
        console.log('Loading URL:', url);
        navigateToUrl(url);
      });

      // Start periodic preview capture
      startPreviewCapture();
    }

    function setupPreviewCanvas() {
      if (!previewCanvas) return;
      previewCanvas.width = webContainer.offsetWidth;
      previewCanvas.height = webContainer.offsetHeight;
    }

    function navigateToUrl(url) {
      // 'about:blank' is the controller's "clear" — back to the placeholder.
      if (url === 'about:blank') {
        currentUrl = '';
        webFrame.src = 'about:blank';
        if (placeholder) placeholder.style.display = 'flex';
        return;
      }

      const normalized = electronAPI.normalizeWebUrl(url);
      if (!normalized) return;

      currentUrl = normalized;
      if (placeholder) placeholder.style.display = 'none';

      // <webview> is a real embedded Chromium view, so it loads sites that
      // refuse to be embedded in an <iframe> (X-Frame-Options / frame-ancestors).
      webFrame.src = currentUrl;
    }

    // ════════════════════════════════════════════════════════════════
    // PREVIEW CAPTURE
    // ════════════════════════════════════════════════════════════════

    function capturePreviewFrame() {
      try {
        if (!previewCanvas || !webContainer) return;

        const ctx = previewCanvas.getContext('2d');
        if (!ctx) return;

        // Draw white background
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);

        // Draw border
        ctx.strokeStyle = '#ddd';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, previewCanvas.width, previewCanvas.height);

        // Draw text showing URL
        ctx.fillStyle = '#333';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Web Browser', previewCanvas.width / 2, 30);
        ctx.font = '12px Arial';
        ctx.fillStyle = '#666';
        const displayUrl = currentUrl.length > 50 ? currentUrl.substring(0, 47) + '...' : currentUrl;
        ctx.fillText(displayUrl, previewCanvas.width / 2, previewCanvas.height - 20);

        // Send preview data
        const imageData = previewCanvas.toDataURL('image/jpeg', 0.7);
        electronAPI.sendPreviewData({
          role: 'web',
          imageData: imageData,
          timestamp: Date.now(),
          url: currentUrl,
        });
      } catch (error) {
        console.error('Error capturing preview frame:', error);
      }
    }

    function startPreviewCapture() {
      updatePreviewInterval = setInterval(capturePreviewFrame, 1000);
    }

    // ════════════════════════════════════════════════════════════════
    // STARTUP
    // ════════════════════════════════════════════════════════════════

    // Handle window resize
    window.addEventListener('resize', () => {
      setupPreviewCanvas();
      capturePreviewFrame();
    });

    // Escape hatch: press Esc to close this fullscreen display window.
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.close();
    });

    // Initialize (placeholder stays until the controller sends a URL)
    initialize();

    // Restore the last page on startup — lets a page be queued from the
    // controller before any screen is assigned to Web.
    electronAPI.getConfig()
      .then(cfg => { const w = cfg && cfg.web; if (w && w.url) navigateToUrl(w.url); })
      .catch(() => {});

    console.log('Web browser display ready');
  </script>
</body>
</html>
