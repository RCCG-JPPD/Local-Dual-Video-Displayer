<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Browser Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }

    #web-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #web-frame {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      display: inline-flex; /* webview needs an explicit display */
    }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div id="web-container">
    <div id="placeholder">Waiting for a web page…</div>
    <webview id="web-frame" allowpopups></webview>
  </div>

  <script>
    // electronAPI is a preload global (contextBridge) — don't redeclare it.
    // (Controller previews are live whole-screen desktopCapturer thumbnails.)

    const webFrame = document.getElementById('web-frame'); // <webview>
    const placeholder = document.getElementById('placeholder');

    let currentUrl = '';

    // ════════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ════════════════════════════════════════════════════════════════

    function initialize() {
      console.log('Web browser display initialized');

      // Listen for URL updates from controller
      electronAPI.onWebUrlChange((url) => {
        console.log('Loading URL:', url);
        navigateToUrl(url);
      });
    }

    function navigateToUrl(url) {
      // 'about:blank' is the controller's "clear" — back to the placeholder.
      if (url === 'about:blank') {
        currentUrl = '';
        webFrame.src = 'about:blank';
        if (placeholder) placeholder.style.display = 'flex';
        return;
      }

      const normalized = electronAPI.normalizeWebUrl(url);
      if (!normalized) return;

      currentUrl = normalized;
      if (placeholder) placeholder.style.display = 'none';

      // <webview> is a real embedded Chromium view, so it loads sites that
      // refuse to be embedded in an <iframe> (X-Frame-Options / frame-ancestors).
      webFrame.src = currentUrl;
    }

    // ════════════════════════════════════════════════════════════════
    // STARTUP
    // ════════════════════════════════════════════════════════════════

    // Escape hatch: press Esc to close this fullscreen display window.
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.close();
    });

    // Initialize (placeholder stays until the controller sends a URL)
    initialize();

    // Restore the last page on startup — lets a page be queued from the
    // controller before any screen is assigned to Web.
    electronAPI.getConfig()
      .then(cfg => { const w = cfg && cfg.web; if (w && w.url) navigateToUrl(w.url); })
      .catch(() => {});

    console.log('Web browser display ready');
  </script>
</body>
</html>
