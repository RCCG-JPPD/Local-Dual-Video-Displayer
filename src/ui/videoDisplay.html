<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #video-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="vid" autoplay playsinline></video>
  </div>

  <script>
    // electronAPI is a preload global (contextBridge) — don't redeclare it.
    // (Controller previews are live whole-screen desktopCapturer thumbnails,
    // so this window does no capture work of its own.)

    const vid = document.getElementById('vid');

    let windowRole = 'video'; // every local-video screen shares this role
    let isPlaying = false;

    // Receive window role from main process
    electronAPI.onWindowRole((role) => {
      windowRole = role;
      console.log(`Video display window role: ${windowRole}`);
    });

    vid.addEventListener('play', () => { isPlaying = true; });
    vid.addEventListener('pause', () => { isPlaying = false; });

    // ════════════════════════════════════════════════════════════════
    // PLAYBACK CONTROL - IPC COMMANDS
    // ════════════════════════════════════════════════════════════════

    // Handle IPC playback commands from controller
    electronAPI.onPlaybackCommand((cmd, data) => {
      handlePlaybackCommand(cmd, data);
    });

    // Send video time to controller every 500ms (main forwards only the primary video window)
    setInterval(() => {
      if (!isNaN(vid.duration) && windowRole === 'video') {
        electronAPI.sendVideoTime(vid.currentTime, vid.duration);
      }
    }, 500);

    function handlePlaybackCommand(cmd, data) {
      console.log(`[${windowRole}] Playback command: ${cmd}`, data);

      switch (cmd) {
        case 'load':
          console.log(`Loading video: ${data}`);
          // Build a correct file:// URL (handles Windows C:\ paths & spaces)
          vid.src = electronAPI.toFileURL(data);
          vid.currentTime = 0;
          vid.play();
          isPlaying = true;
          break;

        case 'play':
          console.log('Playing...');
          vid.play();
          isPlaying = true;
          break;

        case 'pause':
          console.log('Pausing...');
          vid.pause();
          isPlaying = false;
          break;

        case 'seek':
          console.log(`Seeking to ${data}s`);
          vid.currentTime = data;
          break;

        case 'setVolume':
          console.log(`Setting volume to ${data}`);
          // Master volume from the controller. Muted video screens (every screen
          // except the first) ignore this because they're muted at window level.
          vid.volume = Math.max(0, Math.min(1, data));
          break;

        case 'stop':
          console.log('Stopping...');
          vid.pause();
          vid.currentTime = 0;
          isPlaying = false;
          break;

        case 'clear':
          console.log('Clearing video...');
          vid.pause();
          vid.removeAttribute('src');
          vid.load(); // unload the frame so the screen goes back to black
          isPlaying = false;
          break;

        default:
          console.warn(`Unknown command: ${cmd}`);
      }
    }

    // ════════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ════════════════════════════════════════════════════════════════

    // Start paused
    vid.pause();

    vid.addEventListener('loadedmetadata', () => {
      console.log(`Video loaded: ${vid.videoWidth}x${vid.videoHeight}`);
    });

    // Handle video errors
    vid.addEventListener('error', (e) => {
      console.error('Video error:', e);
    });

    // Escape hatch: press Esc to close this fullscreen display window
    // (so a user on a single screen is never trapped behind it).
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.close();
    });

    // Listen for config loaded to get window role
    electronAPI.onConfigLoaded((config) => {
      console.log('Config loaded in video display:', config);
    });

    console.log('Video display window initialized');
  </script>
</body>
</html>
