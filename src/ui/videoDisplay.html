<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #video-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden; /* a zoom scale > 1 crops instead of spilling */
    }

    /* Default zoom = "fit": 100% box + object-fit lets a small video scale UP to
       the screen (max-width/height alone would only ever scale down). Overridden
       inline by applyZoom() — see the setZoom command. */
    video {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
    }

    /* Hidden preview canvas for frame capture */
    #preview-canvas {
      display: none;
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="vid" autoplay playsinline></video>
  </div>

  <!-- Hidden canvas for preview rendering -->
  <canvas id="preview-canvas"></canvas>

  <script>
    // electronAPI is a preload global (contextBridge) — don't redeclare it.

    const vid = document.getElementById('vid');
    const previewCanvas = document.getElementById('preview-canvas');
    const videoContainer = document.getElementById('video-container');

    let windowRole = 'video'; // every local-video screen shares this role
    let isPlaying = false;

    /** Apply a { mode, scale } zoom to the video element (see src/utils/zoom.js). */
    function applyZoom(zoom) {
      Object.assign(vid.style, electronAPI.zoom.styles(zoom));
    }

    // ════════════════════════════════════════════════════════════════
    // WINDOW ROLE & INITIALIZATION
    // ════════════════════════════════════════════════════════════════

    // Receive window role from main process
    electronAPI.onWindowRole((role) => {
      windowRole = role;
      console.log(`Video display window role: ${windowRole}`);

      // Set up canvas for preview rendering
      setupPreviewCanvas();
    });

    // ════════════════════════════════════════════════════════════════
    // CANVAS PREVIEW SETUP
    // ════════════════════════════════════════════════════════════════

    function setupPreviewCanvas() {
      if (!previewCanvas) return;

      previewCanvas.width = videoContainer.offsetWidth;
      previewCanvas.height = videoContainer.offsetHeight;

      startPreviewCapture();
    }

    /**
     * Capture video frame to canvas and send to controller for preview
     */
    function capturePreviewFrame() {
      try {
        if (!previewCanvas || vid.readyState !== 4) return; // Video not ready

        const ctx = previewCanvas.getContext('2d');
        if (!ctx) return;

        // Draw current video frame to canvas
        ctx.drawImage(vid, 0, 0, previewCanvas.width, previewCanvas.height);

        // Send preview data to controller
        const imageData = previewCanvas.toDataURL('image/jpeg', 0.7);
        electronAPI.sendPreviewData({
          role: windowRole,
          imageData: imageData,
          timestamp: Date.now(),
          duration: vid.duration,
          currentTime: vid.currentTime,
          isPaused: vid.paused,
        });
      } catch (error) {
        console.error('Error capturing preview frame:', error);
      }
    }

    /**
     * Start periodic preview capture
     */
    function startPreviewCapture() {
      // Capture every 500ms or when seeking/playing changes
      setInterval(capturePreviewFrame, 500);

      vid.addEventListener('play', () => {
        console.log('Video play event');
        isPlaying = true;
        capturePreviewFrame();
      });

      vid.addEventListener('pause', () => {
        console.log('Video pause event');
        isPlaying = false;
        capturePreviewFrame();
      });

      vid.addEventListener('seeked', () => {
        console.log('Video seeked event');
        capturePreviewFrame();
      });

      vid.addEventListener('timeupdate', () => {
        // Don't capture every timeupdate - too frequent
      });
    }

    // ════════════════════════════════════════════════════════════════
    // PLAYBACK COMMANDS
    // ════════════════════════════════════════════════════════════════

    // ════════════════════════════════════════════════════════════════
    // PLAYBACK CONTROL - IPC COMMANDS
    // ════════════════════════════════════════════════════════════════

    // Handle IPC playback commands from controller
    electronAPI.onPlaybackCommand((cmd, data) => {
      handlePlaybackCommand(cmd, data);
    });

    // Send video time to controller every 500ms (main forwards only the primary video window)
    setInterval(() => {
      if (!isNaN(vid.duration) && windowRole === 'video') {
        electronAPI.sendVideoTime(vid.currentTime, vid.duration);
      }
    }, 500);

    function handlePlaybackCommand(cmd, data) {
      console.log(`[${windowRole}] Playback command: ${cmd}`, data);

      switch (cmd) {
        case 'load':
          console.log(`Loading video: ${data}`);
          // Build a correct file:// URL (handles Windows C:\ paths & spaces)
          vid.src = electronAPI.toFileURL(data);
          vid.currentTime = 0;
          vid.play();
          isPlaying = true;
          break;

        case 'play':
          console.log('Playing...');
          vid.play();
          isPlaying = true;
          break;

        case 'pause':
          console.log('Pausing...');
          vid.pause();
          isPlaying = false;
          break;

        case 'seek':
          console.log(`Seeking to ${data}s`);
          vid.currentTime = data;
          break;

        case 'setVolume':
          console.log(`Setting volume to ${data}`);
          // Master volume from the controller. Muted video screens (every screen
          // except the first) ignore this because they're muted at window level.
          vid.volume = Math.max(0, Math.min(1, data));
          break;

        case 'setZoom':
          console.log('Setting zoom', data);
          applyZoom(data);
          break;

        case 'stop':
          console.log('Stopping...');
          vid.pause();
          vid.currentTime = 0;
          isPlaying = false;
          break;

        case 'clear':
          console.log('Clearing video...');
          vid.pause();
          vid.removeAttribute('src');
          vid.load(); // unload the frame so the screen goes back to black
          isPlaying = false;
          break;

        default:
          console.warn(`Unknown command: ${cmd}`);
      }

      capturePreviewFrame();
    }

    // ════════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ════════════════════════════════════════════════════════════════

    // Start paused
    vid.pause();

    // Set up canvas when video metadata loads
    vid.addEventListener('loadedmetadata', () => {
      console.log(`Video loaded: ${vid.videoWidth}x${vid.videoHeight}`);
      setupPreviewCanvas();
      capturePreviewFrame();
    });

    // Handle video errors
    vid.addEventListener('error', (e) => {
      console.error('Video error:', e);
    });

    // Escape hatch: press Esc to close this fullscreen display window
    // (so a user on a single screen is never trapped behind it).
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.close();
    });

    // Restore the saved zoom on startup, so a screen created later (or on the
    // next run) comes back at whatever the controller last set.
    electronAPI.getConfig()
      .then(cfg => { if (cfg && cfg.zoom) applyZoom(cfg.zoom.video); })
      .catch(() => {});

    // Listen for config loaded to get window role
    electronAPI.onConfigLoaded((config) => {
      console.log('Config loaded in video display:', config);
    });

    console.log('Video display window initialized');
  </script>
</body>
</html>
