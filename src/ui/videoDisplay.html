<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* Fading this container, not the <video>, is what makes the on/off button a
       CURTAIN rather than a stop: the element keeps decoding and keeps its
       audio, so the clip runs on behind the black and the operator gets back
       wherever it has reached. The body underneath is already #000, so there is
       nothing to reveal — unlike the camera screen, this window is not
       see-through. Opacity is driven inline by setVisible(). */
    #video-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden; /* a zoom scale > 1 crops instead of spilling */
      opacity: 1;
    }

    /* Default zoom = "fit": 100% box + object-fit lets a small video scale UP to
       the screen (max-width/height alone would only ever scale down). Overridden
       inline by applyZoom() — see the setZoom command. */
    video {
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
    }

  </style>
</head>
<body>
  <div id="video-container">
    <!-- preload="auto" lets Chromium read as far ahead of the playhead as it
         wants. The default heuristic keeps only a small buffer, which is fine
         on a local disk and not fine on a network volume: one slow read and
         playback is sitting at the end of the buffer with nothing to show. -->
    <video id="vid" autoplay playsinline preload="auto"></video>
  </div>

  <script>
    // electronAPI is a preload global (contextBridge) — don't redeclare it.

    const vid = document.getElementById('vid');
    const videoContainer = document.getElementById('video-container');

    let windowRole = 'video'; // every local-video screen shares this role
    let isPlaying = false;
    let visible = true;       // false = the screen is black, the clip plays on

    // Read through the normalizer, never raw: an install that predates the
    // transition setting simply has no `transition` key.
    let transitionSettings = electronAPI.transition.normalize(null);

    /** Apply a { mode, scale } zoom to the video element (see src/utils/zoom.js). */
    function applyZoom(zoom) {
      Object.assign(vid.style, electronAPI.zoom.styles(zoom));
    }

    /**
     * Show or hide the picture, WITHOUT touching playback.
     *
     * The one control an operator needs when a video has to come off the screen
     * mid-service. Playback is deliberately left alone: the clip (and its
     * sound) carries on behind the black, so bringing it back shows wherever it
     * has got to rather than a stale frame. Use Stop or Clear to actually halt.
     */
    function setVisible(on) {
      visible = !!on;
      Object.assign(videoContainer.style,
        electronAPI.transition.styles(transitionSettings, visible));
    }

    /** The same fade the camera screen uses, so the whole show matches. */
    function applyTransition(t) {
      transitionSettings = electronAPI.transition.normalize(t);
      Object.assign(videoContainer.style,
        electronAPI.transition.styles(transitionSettings, visible));
    }
    electronAPI.onTransitionSettings(applyTransition);

    // ════════════════════════════════════════════════════════════════
    // WINDOW ROLE & INITIALIZATION
    // ════════════════════════════════════════════════════════════════

    // Receive window role from main process
    electronAPI.onWindowRole((role) => {
      windowRole = role;
      console.log(`Video display window role: ${windowRole}`);
    });

    // ════════════════════════════════════════════════════════════════
    // PLAYBACK STATE
    // ════════════════════════════════════════════════════════════════

    vid.addEventListener('play', () => { isPlaying = true; });
    vid.addEventListener('pause', () => { isPlaying = false; });

    // Playback stalls are reported so a struggling source (a slow USB stick,
    // a network drive) is diagnosable instead of just "the video is laggy".
    // `waiting` fires when playback halts for data; `stalled` when no data has
    // arrived for a while.
    let lastStallReport = 0;
    function reportStall(kind) {
      const now = Date.now();
      if (now - lastStallReport < 2000) return; // don't spam a struggling disk
      lastStallReport = now;
      let ahead = 0;
      try {
        for (let i = 0; i < vid.buffered.length; i += 1) {
          if (vid.buffered.start(i) <= vid.currentTime && vid.currentTime <= vid.buffered.end(i)) {
            ahead = vid.buffered.end(i) - vid.currentTime;
          }
        }
      } catch (_) { /* buffered can throw before metadata loads */ }
      const msg = `${kind} at ${vid.currentTime.toFixed(1)}s — `
        + `${ahead.toFixed(1)}s buffered ahead`;
      try { electronAPI.log('error', '[video] ' + msg); } catch (_) {}
      console.warn('[video]', msg);
    }
    vid.addEventListener('waiting', () => reportStall('stalled waiting for data'));
    vid.addEventListener('stalled', () => reportStall('no data arriving'));
    vid.addEventListener('error', () => {
      const e = vid.error;
      const msg = `playback error ${e ? e.code : '?'}: ${e ? e.message : 'unknown'}`;
      try { electronAPI.log('error', '[video] ' + msg); } catch (_) {}
      console.error('[video]', msg);
    });

    // ════════════════════════════════════════════════════════════════
    // PLAYBACK COMMANDS
    // ════════════════════════════════════════════════════════════════

    // ════════════════════════════════════════════════════════════════
    // PLAYBACK CONTROL - IPC COMMANDS
    // ════════════════════════════════════════════════════════════════

    // Handle IPC playback commands from controller
    electronAPI.onPlaybackCommand((cmd, data) => {
      handlePlaybackCommand(cmd, data);
    });

    // Send video time to controller every 500ms (main forwards only the primary video window)
    setInterval(() => {
      if (!isNaN(vid.duration) && windowRole === 'video') {
        electronAPI.sendVideoTime(vid.currentTime, vid.duration);
      }
    }, 500);

    function handlePlaybackCommand(cmd, data) {
      console.log(`[${windowRole}] Playback command: ${cmd}`, data);

      switch (cmd) {
        case 'load':
          console.log(`Loading video: ${data}`);
          // Build a correct file:// URL (handles Windows C:\ paths & spaces)
          vid.src = electronAPI.toFileURL(data);
          vid.currentTime = 0;
          vid.play();
          isPlaying = true;
          break;

        case 'play':
          console.log('Playing...');
          vid.play();
          isPlaying = true;
          break;

        case 'pause':
          console.log('Pausing...');
          vid.pause();
          isPlaying = false;
          break;

        case 'seek':
          console.log(`Seeking to ${data}s`);
          vid.currentTime = data;
          break;

        case 'setVolume':
          console.log(`Setting volume to ${data}`);
          // Master volume from the controller. Muted video screens (every screen
          // except the first) ignore this because they're muted at window level.
          vid.volume = Math.max(0, Math.min(1, data));
          break;

        case 'setZoom':
          console.log('Setting zoom', data);
          applyZoom(data);
          break;

        case 'stop':
          console.log('Stopping...');
          vid.pause();
          vid.currentTime = 0;
          isPlaying = false;
          break;

        case 'setVisible':
          // A curtain, not a transport command — see setVisible().
          setVisible(data);
          break;

        case 'clear':
          console.log('Clearing video...');
          vid.pause();
          vid.removeAttribute('src');
          vid.load(); // unload the frame so the screen goes back to black
          isPlaying = false;
          break;

        default:
          console.warn(`Unknown command: ${cmd}`);
      }
    }

    // ════════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ════════════════════════════════════════════════════════════════

    // Start paused
    vid.pause();

    vid.addEventListener('loadedmetadata', () => {
      console.log(`Video loaded: ${vid.videoWidth}x${vid.videoHeight}`);
    });

    // Escape hatch: press Esc to close this fullscreen display window
    // (so a user on a single screen is never trapped behind it).
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.close();
    });

    // Restore the saved zoom and curtain on startup, so a screen created later
    // (or on the next run) comes back the way the controller last left it.
    electronAPI.getConfig()
      .then((cfg) => {
        if (cfg && cfg.zoom) applyZoom(cfg.zoom.video);
        applyTransition(cfg && cfg.transition);
        setVisible(!cfg || !cfg.playback || cfg.playback.visible !== false);
      })
      .catch(() => {});

    // Listen for config loaded to get window role
    electronAPI.onConfigLoaded((config) => {
      console.log('Config loaded in video display:', config);
    });

    console.log('Video display window initialized');
  </script>
</body>
</html>
