<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unified Controller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      overflow-y: auto;
    }

    .controller-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 5px;
      color: #333;
    }

    .status-bar {
      background: #ddd;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #666;
    }

    /* PREVIEW SECTION */
    .preview-section {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .preview-section h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .preview-card {
      background: #f0f0f0;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .preview-image {
      width: 100%;
      height: 150px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 12px;
      overflow: hidden;
    }

    .preview-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .preview-info {
      padding: 10px;
      font-size: 12px;
      color: #666;
    }

    .preview-role {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .preview-status {
      color: #999;
      font-size: 11px;
    }

    /* CONTROLS SECTION */
    .controls-section {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .controls-section h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
    }

    /* PLAYLIST */
    .playlist-container {
      margin-bottom: 20px;
    }

    .playlist-container h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #555;
    }

    #playlist {
      width: 100%;
      height: 150px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      font-size: 13px;
      font-family: 'Segoe UI', sans-serif;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      background: #f0f0f0;
      border-color: #999;
    }

    button:active:not(:disabled) {
      background: #e0e0e0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .btn-primary:hover:not(:disabled) {
      background: #5568d3;
      border-color: #5568d3;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
    }

    .btn-danger:hover:not(:disabled) {
      background: #dc2626;
      border-color: #dc2626;
    }

    /* PLAYBACK CONTROLS */
    .playback-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .playback-controls button {
      padding: 10px 14px;
      font-size: 14px;
    }

    .scrub-container {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
    }

    #scrub {
      flex: 1;
      min-width: 200px;
    }

    .time-display {
      font-family: 'Monaco', monospace;
      font-size: 13px;
      color: #666;
      min-width: 80px;
      text-align: right;
    }

    .volume-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .volume-container label {
      font-size: 13px;
      color: #666;
    }

    #vol {
      width: 150px;
    }

    /* DISPLAY MANAGEMENT */
    .display-management {
      border-top: 1px solid #e0e0e0;
      padding-top: 15px;
      margin-top: 15px;
    }

    .display-management h3 {
      font-size: 13px;
      margin-bottom: 10px;
      color: #666;
    }

    .display-status {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .display-status.warning {
      color: #f59e0b;
    }

    .display-status.error {
      color: #ef4444;
    }

    input[type="range"] {
      cursor: pointer;
    }

    /* URL INPUT ROWS (YouTube / Web) */
    .url-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .url-row input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    .url-row input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .section-hint {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    /* Controller web browser */
    .web-toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .web-toolbar input {
      flex: 1; min-width: 160px; padding: 8px 10px;
      border: 1px solid #ddd; border-radius: 4px; font-size: 13px;
    }
    .web-toolbar input:focus { outline: none; border-color: #667eea; }
    .ctl-web {
      width: 100%; height: 380px; border: 1px solid #ddd; border-radius: 6px;
      background: #fff; display: inline-flex;
    }
    .controls-section.unavailable webview { pointer-events: none; }

    /* Clock settings grid */
    .clock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }
    .clock-grid label {
      display: flex; flex-direction: column; gap: 4px;
      font-size: 13px; color: #555;
    }
    .clock-grid select {
      padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; background: #fff;
    }
    .clock-grid .clk-check {
      flex-direction: row; align-items: center; gap: 8px;
    }

    /* A section whose display role isn't assigned to any screen */
    .controls-section.unavailable {
      opacity: 0.55;
    }

    .controls-section.unavailable input,
    .controls-section.unavailable button {
      pointer-events: none;
    }

    /* ── Interactive tutorial (spotlight tour) ── */
    .tour-highlight {
      position: relative;
      z-index: 10000;
      border-radius: 8px;
      box-shadow: 0 0 0 4px #667eea, 0 0 0 9999px rgba(15, 23, 42, 0.72);
      transition: box-shadow 0.2s;
    }
    #tour-box {
      position: fixed;
      z-index: 10001;
      max-width: 320px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      padding: 18px 20px;
      display: none;
    }
    #tour-box.show { display: block; }
    #tour-box h4 { font-size: 15px; color: #333; margin-bottom: 6px; }
    #tour-box p { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 14px; }
    .tour-controls { display: flex; align-items: center; gap: 8px; }
    .tour-step { font-size: 12px; color: #999; margin-right: auto; }
    .tour-controls button {
      padding: 6px 14px; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #ddd; background: #fff;
    }
    .tour-controls .tour-next { background: #667eea; color: #fff; border-color: #667eea; }
    .tour-controls .tour-skip { border: none; color: #999; background: transparent; }

    @media (max-width: 768px) {
      .preview-grid {
        grid-template-columns: 1fr;
      }

      .playback-controls {
        flex-direction: column;
      }

      .playback-controls button {
        width: 100%;
      }

      .scrub-container {
        flex-direction: column;
      }

      #scrub {
        width: 100%;
      }

      .time-display {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="controller-container">
    <h1>📺 Unified Display Controller</h1>
    <div class="status-bar" id="status-bar">Ready</div>

    <!-- PREVIEW SECTION -->
    <div class="preview-section">
      <h2>🔴 Live Previews</h2>
      <div class="preview-grid" id="preview-grid">
        <!-- Preview cards will be generated here -->
      </div>
    </div>

    <!-- LOCAL VIDEO SECTION -->
    <div class="controls-section" id="section-localvideo">
      <h2>🎬 Local Video</h2>

      <!-- Playlist -->
      <div class="playlist-container">
        <h3>Playlist</h3>
        <select id="playlist" size="8"></select>
        <div class="button-group">
          <button id="addBtn" class="btn-primary">+ Add Video…</button>
          <button id="removeBtn" class="btn-danger">✕ Remove</button>
        </div>
      </div>

      <!-- Playback Buttons -->
      <div class="playback-controls">
        <button id="prevBtn">⏮ Previous</button>
        <button id="playBtn">▶ Play / ⏸ Pause</button>
        <button id="nextBtn">Next ⏭</button>
        <button id="stopBtn">⏹ Stop</button>
      </div>

      <!-- Scrub Bar -->
      <div class="scrub-container">
        <input id="scrub" type="range" min="0" max="100" value="0">
        <div class="time-display" id="time">00:00 / 00:00</div>
      </div>

      <!-- Volume -->
      <div class="volume-container">
        <label for="vol">🔊 Master Volume</label>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1">
      </div>

    </div>

    <!-- YOUTUBE SECTION -->
    <div class="controls-section" id="section-youtube">
      <h2>▶️ YouTube</h2>
      <div class="url-row">
        <input id="ytUrl" type="text" placeholder="Paste a YouTube link or video ID…">
        <button id="ytPlayBtn" class="btn-primary">Load on YouTube screen</button>
      </div>
      <div class="playback-controls" style="margin-top:12px;">
        <button id="ytPlay">▶ Play</button>
        <button id="ytPause">⏸ Pause</button>
        <button id="ytMute">🔇 Mute</button>
        <span style="display:flex;align-items:center;gap:8px;">
          <label for="ytVol" style="font-size:13px;color:#666;">🔊 Volume</label>
          <input id="ytVol" type="range" min="0" max="1" step="0.01" value="1" style="width:140px;">
        </span>
      </div>
      <div class="section-hint" id="ytHint"></div>
    </div>

    <!-- WEB PAGE SECTION — browse here; the page mirrors onto the Web screen(s) -->
    <div class="controls-section" id="section-web">
      <h2>🌐 Web Page</h2>
      <div class="web-toolbar">
        <button id="webBack" title="Back">◀</button>
        <button id="webFwd" title="Forward">▶</button>
        <button id="webReload" title="Reload">⟳</button>
        <input id="webUrl" type="text" placeholder="Enter a website address (e.g. example.com)…">
        <button id="webGo" class="btn-primary">Go</button>
      </div>
      <webview id="ctlWeb" class="ctl-web" src="about:blank" allowpopups></webview>
      <div class="section-hint" id="webHint">Browse here — the page is mirrored onto your Web screen(s).</div>
    </div>

    <!-- CLOCK SECTION -->
    <div class="controls-section" id="section-clock">
      <h2>🕐 Clock</h2>
      <div class="clock-grid">
        <label>Mode
          <select id="clkMode">
            <option value="time">Current time</option>
            <option value="countdown">Countdown (duration)</option>
            <option value="timer">Countdown to a time</option>
          </select>
        </label>
        <label>Size
          <select id="clkSize">
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>
        </label>
        <label>Corner
          <select id="clkCorner">
            <option value="top-left">Top-left</option>
            <option value="top-right">Top-right</option>
            <option value="bottom-left">Bottom-left</option>
            <option value="bottom-right">Bottom-right</option>
            <option value="center">Center</option>
          </select>
        </label>
        <label>Theme
          <select id="clkTheme">
            <option value="dark">Dark (black bg)</option>
            <option value="light">Light (white bg)</option>
          </select>
        </label>
        <label>Effect / animation
          <select id="clkHoliday"></select>
        </label>
        <label class="clk-check"><input type="checkbox" id="clkSeconds"> Show seconds</label>
        <label class="clk-check"><input type="checkbox" id="clk12h"> 12-hour time</label>
      </div>

      <div id="clkCountdownRow" class="url-row" style="margin-top:10px; display:none;">
        <input id="clkH" type="number" min="0" placeholder="Hours" style="max-width:90px">
        <input id="clkM" type="number" min="0" placeholder="Minutes" style="max-width:90px">
        <input id="clkS" type="number" min="0" placeholder="Seconds" style="max-width:90px">
        <button id="clkStart" class="btn-primary">Start countdown</button>
      </div>
      <div id="clkTimerRow" class="url-row" style="margin-top:10px; display:none;">
        <input id="clkTarget" type="datetime-local">
      </div>
      <div class="section-hint" id="clkHint"></div>
    </div>

    <!-- DISPLAYS SECTION -->
    <div class="controls-section">
      <h2>🖥️ Displays</h2>
      <div class="display-status" id="display-status">Connected displays: Loading...</div>
      <div class="button-group">
        <button id="reconfigBtn">⚙️ Reconfigure Displays</button>
        <button id="identifyBtn">🔦 Identify Screens</button>
        <button id="tutorialBtn">🎓 Tutorial</button>
        <button id="helpBtn">❓ Help</button>
      </div>
    </div>
  </div>

  <!-- Interactive tutorial spotlight box -->
  <div id="tour-box">
    <h4 id="tour-title"></h4>
    <p id="tour-text"></p>
    <div class="tour-controls">
      <span class="tour-step" id="tour-step"></span>
      <button class="tour-skip" id="tour-skip">Skip</button>
      <button class="tour-back" id="tour-back">Back</button>
      <button class="tour-next" id="tour-next">Next</button>
    </div>
  </div>

  <script>
    // electronAPI is a preload global (contextBridge) — don't redeclare it.

    // ════════════════════════════════════════════════════════════════
    // DOM ELEMENTS
    // ════════════════════════════════════════════════════════════════

    const playlistSel = document.getElementById('playlist');
    const scrub = document.getElementById('scrub');
    const timeLabel = document.getElementById('time');
    const volSlider = document.getElementById('vol');
    const playBtn = document.getElementById('playBtn');
    const statusBar = document.getElementById('status-bar');
    const previewGrid = document.getElementById('preview-grid');
    const displayStatus = document.getElementById('display-status');

    // ════════════════════════════════════════════════════════════════
    // STATE
    // ════════════════════════════════════════════════════════════════

    let playlist = [];
    let currentIndex = -1;
    let isPlaying = false;
    let duration = 0;
    let config = {};

    // ════════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ════════════════════════════════════════════════════════════════

    async function initialize() {
      try {
        // Load config
        config = await electronAPI.getConfig();
        console.log('Controller config loaded:', config);

        // Load playlist from config
        if (config.playback && config.playback.playlist) {
          playlist = config.playback.playlist;
          renderPlaylist();
        }

        // Apply role availability + clock controls for the current config
        refreshControllerForConfig(config);

        // Start live whole-screen previews
        startScreenPreviews();

        // Load window status
        const windowStatus = await electronAPI.getWindowStatus();
        console.log('Window status:', windowStatus);
        updateDisplayStatus(windowStatus);

        statusBar.textContent = `✓ Ready with ${playlist.length} video(s) queued`;
      } catch (error) {
        console.error('Initialization error:', error);
        statusBar.textContent = '✗ Initialization failed';
      }
    }

    const ROLE_LABELS = { video: 'Video', youtube: 'YouTube', web: 'Web Page', clock: 'Clock' };

    // Re-apply everything that depends on the current config (used on first load
    // AND after Reconfigure, via onConfigLoaded — so sections/clock re-enable live).
    function refreshControllerForConfig(cfg) {
      applyRoleAvailability(cfg);
      initClockControls(cfg);
    }

    // ── Live WHOLE-SCREEN previews (desktopCapturer): one card per assigned screen ──
    let previewTimer = null;
    function startScreenPreviews() {
      refreshScreenPreviews();
      if (previewTimer) clearInterval(previewTimer);
      previewTimer = setInterval(refreshScreenPreviews, 1500);
    }

    async function refreshScreenPreviews() {
      let previews = [];
      try { previews = await electronAPI.getScreenPreviews(); } catch (_) {}
      const byId = new Map((previews || []).filter(p => p.id != null).map(p => [String(p.id), p.dataURL]));

      const displays = (config.displays || []).filter(d => d.role && d.role !== 'unassigned');
      previewGrid.innerHTML = '';
      if (!displays.length) {
        previewGrid.innerHTML = '<div class="preview-status" style="padding:10px">No screens assigned yet — use “Reconfigure Displays”.</div>';
        return;
      }

      displays.forEach((d, i) => {
        const card = document.createElement('div');
        card.className = 'preview-card';

        const image = document.createElement('div');
        image.className = 'preview-image';
        const url = byId.get(String(d.id)) || (previews[i] && previews[i].dataURL);
        if (url) {
          const im = document.createElement('img');
          im.src = url;
          image.appendChild(im);
        } else {
          image.textContent = 'No preview';
        }

        const info = document.createElement('div');
        info.className = 'preview-info';
        const roleLabel = document.createElement('div');
        roleLabel.className = 'preview-role';
        const num = (d.displayIndex != null ? d.displayIndex : i) + 1;
        roleLabel.textContent = `Screen ${num} · ${ROLE_LABELS[d.role] || d.role}`;
        info.appendChild(roleLabel);

        card.appendChild(image);
        card.appendChild(info);
        previewGrid.appendChild(card);
      });
    }

    // ════════════════════════════════════════════════════════════════
    // PLAYLIST MANAGEMENT
    // ════════════════════════════════════════════════════════════════

    document.getElementById('addBtn').onclick = async () => {
      const files = await electronAPI.selectVideoFiles();
      files.forEach(f => {
        if (!playlist.includes(f)) {
          playlist.push(f);
        }
      });
      renderPlaylist();
      if (currentIndex === -1 && playlist.length > 0) {
        load(0);
      }
    };

    document.getElementById('removeBtn').onclick = () => {
      if (currentIndex > -1) {
        playlist.splice(currentIndex, 1);
        if (currentIndex >= playlist.length) currentIndex--;
        renderPlaylist();
        if (currentIndex >= 0) {
          load(currentIndex);
        } else if (playlist.length > 0) {
          load(0);
        } else {
          isPlaying = false;
          playBtn.textContent = '▶ Play';
        }
      }
    };

    function renderPlaylist() {
      playlistSel.innerHTML = playlist.map((p, i) =>
        `<option value="${i}" ${i === currentIndex ? 'selected' : ''}>${pathBasename(p)}</option>`
      ).join('');
    }

    function pathBasename(p) {
      return p.split(/[\\/]/).pop();
    }

    // Double-click (or Enter on) a playlist item to play it.
    playlistSel.addEventListener('dblclick', () => {
      if (playlistSel.selectedIndex >= 0) load(playlistSel.selectedIndex);
    });
    playlistSel.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && playlistSel.selectedIndex >= 0) load(playlistSel.selectedIndex);
    });

    // ════════════════════════════════════════════════════════════════
    // PLAYBACK CONTROL
    // ════════════════════════════════════════════════════════════════

    function send(cmd, data) {
      electronAPI.sendPlaybackCommand(cmd, data);
    }

    function load(i) {
      if (i == null || i < 0 || i >= playlist.length) return;
      currentIndex = i;
      renderPlaylist();
      send('load', playlist[currentIndex]);
      isPlaying = true;
      playBtn.textContent = '⏸ Pause';
      statusBar.textContent = `Now playing: ${pathBasename(playlist[currentIndex])}`;
    }

    playBtn.onclick = () => {
      if (currentIndex === -1) return;
      if (isPlaying) {
        send('pause');
        isPlaying = false;
        playBtn.textContent = '▶ Play';
        statusBar.textContent = 'Paused';
      } else {
        send('play');
        isPlaying = true;
        playBtn.textContent = '⏸ Pause';
        statusBar.textContent = 'Playing...';
      }
    };

    document.getElementById('prevBtn').onclick = () => load((currentIndex - 1 + playlist.length) % playlist.length);
    document.getElementById('nextBtn').onclick = () => load((currentIndex + 1) % playlist.length);
    document.getElementById('stopBtn').onclick = () => {
      send('stop');
      isPlaying = false;
      playBtn.textContent = '▶ Play';
      statusBar.textContent = 'Stopped';
    };

    // ════════════════════════════════════════════════════════════════
    // SCRUB BAR
    // ════════════════════════════════════════════════════════════════

    scrub.oninput = () => send('seek', scrub.value * duration / 100);

    // Listen for video time updates
    electronAPI.onVideoTime((currentTime, dur) => {
      duration = dur;
      if (!scrub.dragging) scrub.value = (currentTime / dur) * 100 || 0;
      timeLabel.textContent = fmt(currentTime) + ' / ' + fmt(dur);
    });

    function fmt(t) {
      if (isNaN(t)) return '00:00';
      const m = Math.floor(t / 60).toString().padStart(2, '0');
      const s = Math.floor(t % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // ════════════════════════════════════════════════════════════════
    // VOLUME CONTROL
    // ════════════════════════════════════════════════════════════════

    volSlider.oninput = () => send('setVolume', parseFloat(volSlider.value));

    // Previews are now live whole-screen thumbnails (see refreshScreenPreviews).

    // Re-sync the controller when the config changes (after Reconfigure) so the
    // YouTube / Web / Clock sections re-enable without restarting the app.
    electronAPI.onConfigLoaded((cfg) => {
      if (!cfg) return;
      config = cfg;
      if (cfg.playback && Array.isArray(cfg.playback.playlist)) {
        playlist = cfg.playback.playlist;
        renderPlaylist();
      }
      refreshControllerForConfig(cfg);
      refreshScreenPreviews();
      electronAPI.getWindowStatus().then(updateDisplayStatus).catch(() => {});
    });

    // ════════════════════════════════════════════════════════════════
    // DISPLAY MANAGEMENT
    // ════════════════════════════════════════════════════════════════

    function updateDisplayStatus(windowStatus) {
      if (!windowStatus) return;

      const parts = [];
      if (windowStatus.video)   parts.push(`${windowStatus.video} Video`);
      if (windowStatus.youtube) parts.push(`${windowStatus.youtube} YouTube`);
      if (windowStatus.web)     parts.push(`${windowStatus.web} Web`);
      if (windowStatus.clock)   parts.push(`${windowStatus.clock} Clock`);

      displayStatus.classList.remove('warning', 'error');
      if (parts.length === 0) {
        displayStatus.textContent = 'No screens active — use “Reconfigure Displays” to assign some.';
        displayStatus.classList.add('warning');
      } else {
        displayStatus.textContent = 'Active screens: ' + parts.join(', ');
      }
    }

    document.getElementById('reconfigBtn').onclick = () => {
      console.log('Reconfigure displays requested');
      electronAPI.reconfigureDisplays();
    };

    document.getElementById('identifyBtn').onclick = () => electronAPI.identifyScreens();
    document.getElementById('helpBtn').onclick = () => electronAPI.openHelp();

    // ════════════════════════════════════════════════════════════════
    // YOUTUBE CONTROL
    // ════════════════════════════════════════════════════════════════

    const ytUrl = document.getElementById('ytUrl');

    function sendYouTube() {
      const url = ytUrl.value.trim();
      if (!url) return;
      electronAPI.sendYouTubeUrl(url);
      statusBar.textContent = `▶️ Sent to YouTube screen: ${url}`;
    }

    document.getElementById('ytPlayBtn').onclick = sendYouTube;
    ytUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendYouTube(); });

    // YouTube playback controls (drive the embedded player on the YouTube screen).
    let ytMuted = false;
    document.getElementById('ytPlay').onclick = () => electronAPI.sendYouTubeCommand('play');
    document.getElementById('ytPause').onclick = () => electronAPI.sendYouTubeCommand('pause');
    document.getElementById('ytVol').oninput = (e) => electronAPI.sendYouTubeCommand('setVolume', parseFloat(e.target.value));
    document.getElementById('ytMute').onclick = () => {
      ytMuted = !ytMuted;
      electronAPI.sendYouTubeCommand('mute', ytMuted);
      document.getElementById('ytMute').textContent = ytMuted ? '🔈 Unmute' : '🔇 Mute';
    };

    // ════════════════════════════════════════════════════════════════
    // WEB BROWSER — browse in the controller; mirror the page to web screens
    // ════════════════════════════════════════════════════════════════

    const ctlWeb = document.getElementById('ctlWeb');
    const webUrl = document.getElementById('webUrl');
    let webReady = false;

    function goWeb() {
      const url = electronAPI.normalizeWebUrl(webUrl.value);
      if (url) ctlWeb.src = url; // setting src navigates (works before/after dom-ready)
    }

    document.getElementById('webGo').onclick = goWeb;
    webUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') goWeb(); });
    document.getElementById('webBack').onclick = () => { if (webReady && ctlWeb.canGoBack()) ctlWeb.goBack(); };
    document.getElementById('webFwd').onclick = () => { if (webReady && ctlWeb.canGoForward()) ctlWeb.goForward(); };
    document.getElementById('webReload').onclick = () => { if (webReady) ctlWeb.reload(); };

    ctlWeb.addEventListener('dom-ready', () => { webReady = true; });

    // Mirror whatever the controller browses (typed URL or clicked links) to the web screens.
    function mirrorWeb(url) {
      if (!url || url === 'about:blank') return;
      webUrl.value = url;
      electronAPI.sendWebUrl(url);
    }
    ctlWeb.addEventListener('did-navigate', (e) => mirrorWeb(e.url));
    ctlWeb.addEventListener('did-navigate-in-page', (e) => { if (e.isMainFrame) mirrorWeb(e.url); });
    // Keep target=_blank / popups inside the same embedded browser.
    ctlWeb.addEventListener('new-window', (e) => { if (e.url) ctlWeb.src = e.url; });

    // ════════════════════════════════════════════════════════════════
    // CLOCK CONTROLS
    // ════════════════════════════════════════════════════════════════

    const clk = {
      mode: document.getElementById('clkMode'),
      size: document.getElementById('clkSize'),
      corner: document.getElementById('clkCorner'),
      theme: document.getElementById('clkTheme'),
      holiday: document.getElementById('clkHoliday'),
      seconds: document.getElementById('clkSeconds'),
      h12: document.getElementById('clk12h'),
      h: document.getElementById('clkH'),
      m: document.getElementById('clkM'),
      s: document.getElementById('clkS'),
      target: document.getElementById('clkTarget'),
      countdownRow: document.getElementById('clkCountdownRow'),
      timerRow: document.getElementById('clkTimerRow'),
      hint: document.getElementById('clkHint'),
    };

    const titleCase = (s) => s.charAt(0).toUpperCase() + s.slice(1);

    function initClockControls(cfg) {
      const c = (cfg && cfg.clock) || {};

      // Populate Theme dropdown from the shared theme list.
      clk.theme.innerHTML = (electronAPI.clockThemes() || [])
        .map(t => `<option value="${t.key}">${t.name}</option>`).join('');

      // Populate the Effect dropdown: Auto (by holiday), Off, then each effect.
      clk.holiday.innerHTML = '<option value="auto">Auto (by holiday)</option><option value="off">Off</option>'
        + (electronAPI.animationList() || []).map(a => `<option value="${a}">${titleCase(a)}</option>`).join('');

      clk.mode.value = c.mode || 'time';
      clk.size.value = c.size || 'medium';
      clk.corner.value = c.corner || 'bottom-right';
      clk.theme.value = c.theme || 'dark';
      clk.holiday.value = c.holiday || 'auto';
      clk.seconds.checked = c.showSeconds !== false;
      clk.h12.checked = !!c.hour12;
      const cd = c.countdown || { hours: 0, minutes: 5, seconds: 0 };
      clk.h.value = cd.hours ?? 0; clk.m.value = cd.minutes ?? 5; clk.s.value = cd.seconds ?? 0;
      clk.target.value = c.targetTime || '';

      updateClockRows();
    }

    function updateClockRows() {
      clk.countdownRow.style.display = clk.mode.value === 'countdown' ? 'flex' : 'none';
      clk.timerRow.style.display = clk.mode.value === 'timer' ? 'flex' : 'none';
    }

    function clockSettings() {
      return {
        mode: clk.mode.value,
        size: clk.size.value,
        corner: clk.corner.value,
        theme: clk.theme.value,
        holiday: clk.holiday.value,
        showSeconds: clk.seconds.checked,
        hour12: clk.h12.checked,
        countdown: { hours: +clk.h.value || 0, minutes: +clk.m.value || 0, seconds: +clk.s.value || 0 },
        targetTime: clk.target.value,
      };
    }

    function pushClock() {
      electronAPI.sendClockSettings(clockSettings());
      clk.hint.textContent = '✓ Clock updated';
      setTimeout(() => { clk.hint.textContent = ''; }, 1500);
    }

    // Live-apply on any change (except the fixed-duration countdown, which is "Start"-driven).
    ['size', 'corner', 'theme', 'holiday'].forEach(k => clk[k].addEventListener('change', pushClock));
    ['seconds', 'h12'].forEach(k => clk[k].addEventListener('change', pushClock));
    clk.mode.addEventListener('change', () => { updateClockRows(); pushClock(); });
    clk.target.addEventListener('change', pushClock);
    document.getElementById('clkStart').onclick = pushClock; // restart countdown with current H:M:S

    // Dim + disable sections whose display role isn't assigned to any screen,
    // so the controller only offers what the current setup can actually show.
    function applyRoleAvailability(cfg) {
      const roles = new Set((cfg.displays || []).map(d => d.role));

      const sections = {
        localvideo: roles.has('video'),
        youtube: roles.has('youtube'),
        web: roles.has('web'),
        clock: roles.has('clock'),
      };

      Object.entries(sections).forEach(([key, available]) => {
        const el = document.getElementById(`section-${key}`);
        if (el) el.classList.toggle('unavailable', !available);
      });

      const hint = 'No screen is assigned to this. Use “Reconfigure Displays” to add one.';
      document.getElementById('ytHint').textContent = sections.youtube ? '' : hint;
      document.getElementById('webHint').textContent = sections.web
        ? 'Browse here — the page is mirrored onto your Web screen(s).'
        : hint;
    }

    // ════════════════════════════════════════════════════════════════
    // INTERACTIVE TUTORIAL (spotlight tour)
    // ════════════════════════════════════════════════════════════════

    const TOUR_STEPS = [
      { sel: '#preview-grid',        title: '👀 Live previews', text: 'Each active screen shows a small live thumbnail here, so you can monitor every display at a glance.' },
      { sel: '#section-localvideo',  title: '🎬 Local video', text: 'Add video files and control them here — Play/Pause, scrub, and Master Volume. The video plays on every screen set to “Video”.' },
      { sel: '#section-youtube',     title: '▶️ YouTube', text: 'Paste a YouTube link (or video ID) and press Enter to play it on your YouTube screen(s).' },
      { sel: '#section-web',         title: '🌐 Web page', text: 'Type any website address and press Enter to show it on your Web screen(s).' },
      { sel: '#identifyBtn',         title: '🔦 Identify screens', text: 'Not sure which physical screen is which? This flashes a big number on each one.' },
      { sel: '#reconfigBtn',         title: '⚙️ Reconfigure', text: 'Change which screen shows what at any time. That’s it — you’re ready to go!' },
    ];

    const tourBox = document.getElementById('tour-box');
    let tourIndex = 0;
    let tourTarget = null;

    function positionTourBox(target) {
      const r = target.getBoundingClientRect();
      const boxW = tourBox.offsetWidth, boxH = tourBox.offsetHeight;
      let top = r.bottom + 12;
      if (top + boxH > window.innerHeight - 8) top = Math.max(8, r.top - boxH - 12);
      let left = Math.min(Math.max(8, r.left), window.innerWidth - boxW - 8);
      tourBox.style.top = top + 'px';
      tourBox.style.left = left + 'px';
    }

    function showTourStep(i) {
      if (tourTarget) tourTarget.classList.remove('tour-highlight');
      tourIndex = i;
      const step = TOUR_STEPS[i];
      tourTarget = document.querySelector(step.sel);
      if (!tourTarget) { endTour(); return; }

      tourTarget.scrollIntoView({ block: 'center', behavior: 'smooth' });
      tourTarget.classList.add('tour-highlight');

      document.getElementById('tour-title').textContent = step.title;
      document.getElementById('tour-text').textContent = step.text;
      document.getElementById('tour-step').textContent = `${i + 1} / ${TOUR_STEPS.length}`;
      document.getElementById('tour-back').style.visibility = i === 0 ? 'hidden' : 'visible';
      document.getElementById('tour-next').textContent = i === TOUR_STEPS.length - 1 ? 'Finish' : 'Next';
      tourBox.classList.add('show');
      // Position after layout/scroll settles.
      setTimeout(() => positionTourBox(tourTarget), 250);
    }

    function startTour() { showTourStep(0); }

    function endTour() {
      if (tourTarget) tourTarget.classList.remove('tour-highlight');
      tourTarget = null;
      tourBox.classList.remove('show');
      try { localStorage.setItem('tutorialSeen', '1'); } catch (_) {}
    }

    document.getElementById('tour-next').onclick = () =>
      tourIndex >= TOUR_STEPS.length - 1 ? endTour() : showTourStep(tourIndex + 1);
    document.getElementById('tour-back').onclick = () => showTourStep(Math.max(0, tourIndex - 1));
    document.getElementById('tour-skip').onclick = endTour;
    document.getElementById('tutorialBtn').onclick = startTour;
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && tourBox.classList.contains('show')) endTour(); });
    window.addEventListener('resize', () => { if (tourTarget) positionTourBox(tourTarget); });

    // Auto-run once, the first time the controller opens.
    function maybeAutoTour() {
      let seen = false;
      try { seen = localStorage.getItem('tutorialSeen') === '1'; } catch (_) {}
      if (!seen) setTimeout(startTour, 700);
    }

    // ════════════════════════════════════════════════════════════════
    // STARTUP
    // ════════════════════════════════════════════════════════════════

    initialize();
    maybeAutoTour();
  </script>
</body>
</html>
