<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unified Controller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      overflow-y: auto;
    }

    .controller-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 5px;
      color: #333;
    }

    .status-bar {
      background: #ddd;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #666;
    }

    /* PREVIEW SECTION */
    .preview-section {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .preview-section h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .preview-card {
      background: #f0f0f0;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .preview-image {
      width: 100%;
      height: 150px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 12px;
      overflow: hidden;
    }

    .preview-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .preview-info {
      padding: 10px;
      font-size: 12px;
      color: #666;
    }

    .preview-role {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .preview-status {
      color: #999;
      font-size: 11px;
    }

    /* CONTROLS SECTION */
    .controls-section {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .controls-section h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
    }

    /* PLAYLIST */
    .playlist-container {
      margin-bottom: 20px;
    }

    .playlist-container h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #555;
    }

    #playlist {
      width: 100%;
      height: 150px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      font-size: 13px;
      font-family: 'Segoe UI', sans-serif;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      background: #f0f0f0;
      border-color: #999;
    }

    button:active:not(:disabled) {
      background: #e0e0e0;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .btn-primary:hover:not(:disabled) {
      background: #5568d3;
      border-color: #5568d3;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
    }

    .btn-danger:hover:not(:disabled) {
      background: #dc2626;
      border-color: #dc2626;
    }

    /* PLAYBACK CONTROLS */
    .playback-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .playback-controls button {
      padding: 10px 14px;
      font-size: 14px;
    }

    .scrub-container {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
    }

    #scrub {
      flex: 1;
      min-width: 200px;
    }

    .time-display {
      font-family: 'Monaco', monospace;
      font-size: 13px;
      color: #666;
      min-width: 80px;
      text-align: right;
    }

    .volume-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .volume-container label {
      font-size: 13px;
      color: #666;
    }

    #vol {
      width: 150px;
    }

    /* DISPLAY MANAGEMENT */
    .display-management {
      border-top: 1px solid #e0e0e0;
      padding-top: 15px;
      margin-top: 15px;
    }

    .display-management h3 {
      font-size: 13px;
      margin-bottom: 10px;
      color: #666;
    }

    .display-status {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .display-status.warning {
      color: #f59e0b;
    }

    .display-status.error {
      color: #ef4444;
    }

    input[type="range"] {
      cursor: pointer;
    }

    /* URL INPUT ROWS (YouTube / Web) */
    .url-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .url-row input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    .url-row input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .section-hint {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    /* A section whose display role isn't assigned to any screen */
    .controls-section.unavailable {
      opacity: 0.55;
    }

    .controls-section.unavailable input,
    .controls-section.unavailable button {
      pointer-events: none;
    }

    /* ── Interactive tutorial (spotlight tour) ── */
    .tour-highlight {
      position: relative;
      z-index: 10000;
      border-radius: 8px;
      box-shadow: 0 0 0 4px #667eea, 0 0 0 9999px rgba(15, 23, 42, 0.72);
      transition: box-shadow 0.2s;
    }
    #tour-box {
      position: fixed;
      z-index: 10001;
      max-width: 320px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      padding: 18px 20px;
      display: none;
    }
    #tour-box.show { display: block; }
    #tour-box h4 { font-size: 15px; color: #333; margin-bottom: 6px; }
    #tour-box p { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 14px; }
    .tour-controls { display: flex; align-items: center; gap: 8px; }
    .tour-step { font-size: 12px; color: #999; margin-right: auto; }
    .tour-controls button {
      padding: 6px 14px; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #ddd; background: #fff;
    }
    .tour-controls .tour-next { background: #667eea; color: #fff; border-color: #667eea; }
    .tour-controls .tour-skip { border: none; color: #999; background: transparent; }

    @media (max-width: 768px) {
      .preview-grid {
        grid-template-columns: 1fr;
      }

      .playback-controls {
        flex-direction: column;
      }

      .playback-controls button {
        width: 100%;
      }

      .scrub-container {
        flex-direction: column;
      }

      #scrub {
        width: 100%;
      }

      .time-display {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="controller-container">
    <h1>📺 Unified Display Controller</h1>
    <div class="status-bar" id="status-bar">Ready</div>

    <!-- PREVIEW SECTION -->
    <div class="preview-section">
      <h2>🔴 Live Previews</h2>
      <div class="preview-grid" id="preview-grid">
        <!-- Preview cards will be generated here -->
      </div>
    </div>

    <!-- LOCAL VIDEO SECTION -->
    <div class="controls-section" id="section-localvideo">
      <h2>🎬 Local Video</h2>

      <!-- Playlist -->
      <div class="playlist-container">
        <h3>Playlist</h3>
        <select id="playlist" size="8"></select>
        <div class="button-group">
          <button id="addBtn" class="btn-primary">+ Add Video…</button>
          <button id="removeBtn" class="btn-danger">✕ Remove</button>
        </div>
      </div>

      <!-- Playback Buttons -->
      <div class="playback-controls">
        <button id="prevBtn">⏮ Previous</button>
        <button id="playBtn">▶ Play / ⏸ Pause</button>
        <button id="nextBtn">Next ⏭</button>
        <button id="stopBtn">⏹ Stop</button>
      </div>

      <!-- Scrub Bar -->
      <div class="scrub-container">
        <input id="scrub" type="range" min="0" max="100" value="0">
        <div class="time-display" id="time">00:00 / 00:00</div>
      </div>

      <!-- Volume -->
      <div class="volume-container">
        <label for="vol">🔊 Master Volume</label>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1">
      </div>

    </div>

    <!-- YOUTUBE SECTION -->
    <div class="controls-section" id="section-youtube">
      <h2>▶️ YouTube</h2>
      <div class="url-row">
        <input id="ytUrl" type="text" placeholder="Paste a YouTube link or video ID…">
        <button id="ytPlayBtn" class="btn-primary">Play on YouTube screen</button>
      </div>
      <div class="section-hint" id="ytHint"></div>
    </div>

    <!-- WEB PAGE SECTION -->
    <div class="controls-section" id="section-web">
      <h2>🌐 Web Page</h2>
      <div class="url-row">
        <input id="webUrl" type="text" placeholder="Enter a website address (e.g. example.com)…">
        <button id="webOpenBtn" class="btn-primary">Open on Web screen</button>
      </div>
      <div class="section-hint" id="webHint"></div>
    </div>

    <!-- DISPLAYS SECTION -->
    <div class="controls-section">
      <h2>🖥️ Displays</h2>
      <div class="display-status" id="display-status">Connected displays: Loading...</div>
      <div class="button-group">
        <button id="reconfigBtn">⚙️ Reconfigure Displays</button>
        <button id="identifyBtn">🔦 Identify Screens</button>
        <button id="tutorialBtn">🎓 Tutorial</button>
        <button id="helpBtn">❓ Help</button>
      </div>
    </div>
  </div>

  <!-- Interactive tutorial spotlight box -->
  <div id="tour-box">
    <h4 id="tour-title"></h4>
    <p id="tour-text"></p>
    <div class="tour-controls">
      <span class="tour-step" id="tour-step"></span>
      <button class="tour-skip" id="tour-skip">Skip</button>
      <button class="tour-back" id="tour-back">Back</button>
      <button class="tour-next" id="tour-next">Next</button>
    </div>
  </div>

  <script>
    // electronAPI is a preload global (contextBridge) — don't redeclare it.

    // ════════════════════════════════════════════════════════════════
    // DOM ELEMENTS
    // ════════════════════════════════════════════════════════════════

    const playlistSel = document.getElementById('playlist');
    const scrub = document.getElementById('scrub');
    const timeLabel = document.getElementById('time');
    const volSlider = document.getElementById('vol');
    const playBtn = document.getElementById('playBtn');
    const statusBar = document.getElementById('status-bar');
    const previewGrid = document.getElementById('preview-grid');
    const displayStatus = document.getElementById('display-status');

    // ════════════════════════════════════════════════════════════════
    // STATE
    // ════════════════════════════════════════════════════════════════

    let playlist = [];
    let currentIndex = -1;
    let isPlaying = false;
    let duration = 0;
    let config = {};
    let previewContainers = {};

    // ════════════════════════════════════════════════════════════════
    // INITIALIZATION
    // ════════════════════════════════════════════════════════════════

    async function initialize() {
      try {
        // Load config
        config = await electronAPI.getConfig();
        console.log('Controller config loaded:', config);

        // Load playlist from config
        if (config.playback && config.playback.playlist) {
          playlist = config.playback.playlist;
          renderPlaylist();
        }

        // Set up preview cards for each display role
        setupPreviewCards();

        // Enable only the sections whose role is assigned to a screen
        applyRoleAvailability(config);

        // Load window status
        const windowStatus = await electronAPI.getWindowStatus();
        console.log('Window status:', windowStatus);
        updateDisplayStatus(windowStatus);

        statusBar.textContent = `✓ Ready with ${playlist.length} video(s) queued`;
      } catch (error) {
        console.error('Initialization error:', error);
        statusBar.textContent = '✗ Initialization failed';
      }
    }

    function setupPreviewCards() {
      previewGrid.innerHTML = '';
      previewContainers = {};

      const roleLabels = {
        video: 'Video',
        youtube: 'YouTube',
        web: 'Web Page',
        clock: 'Clock',
      };

      Object.entries(roleLabels).forEach(([role, label]) => {
        const card = document.createElement('div');
        card.className = 'preview-card';
        card.id = `preview-${role}`;

        const image = document.createElement('div');
        image.className = 'preview-image';
        image.textContent = 'Waiting for preview...';

        const info = document.createElement('div');
        info.className = 'preview-info';

        const roleLabel = document.createElement('div');
        roleLabel.className = 'preview-role';
        roleLabel.textContent = label;

        const status = document.createElement('div');
        status.className = 'preview-status';
        status.textContent = 'Connecting...';

        info.appendChild(roleLabel);
        info.appendChild(status);
        card.appendChild(image);
        card.appendChild(info);
        previewGrid.appendChild(card);

        previewContainers[role] = { image, status };
      });
    }

    // ════════════════════════════════════════════════════════════════
    // PLAYLIST MANAGEMENT
    // ════════════════════════════════════════════════════════════════

    document.getElementById('addBtn').onclick = async () => {
      const files = await electronAPI.selectVideoFiles();
      files.forEach(f => {
        if (!playlist.includes(f)) {
          playlist.push(f);
        }
      });
      renderPlaylist();
      if (currentIndex === -1 && playlist.length > 0) {
        load(0);
      }
    };

    document.getElementById('removeBtn').onclick = () => {
      if (currentIndex > -1) {
        playlist.splice(currentIndex, 1);
        if (currentIndex >= playlist.length) currentIndex--;
        renderPlaylist();
        if (currentIndex >= 0) {
          load(currentIndex);
        } else if (playlist.length > 0) {
          load(0);
        } else {
          isPlaying = false;
          playBtn.textContent = '▶ Play';
        }
      }
    };

    function renderPlaylist() {
      playlistSel.innerHTML = playlist.map((p, i) =>
        `<option value="${i}" ${i === currentIndex ? 'selected' : ''}>${pathBasename(p)}</option>`
      ).join('');
    }

    function pathBasename(p) {
      return p.split(/[\\/]/).pop();
    }

    // ════════════════════════════════════════════════════════════════
    // PLAYBACK CONTROL
    // ════════════════════════════════════════════════════════════════

    function send(cmd, data) {
      electronAPI.sendPlaybackCommand(cmd, data);
    }

    function load(i) {
      if (i == null || i < 0 || i >= playlist.length) return;
      currentIndex = i;
      renderPlaylist();
      send('load', playlist[currentIndex]);
      isPlaying = true;
      playBtn.textContent = '⏸ Pause';
      statusBar.textContent = `Now playing: ${pathBasename(playlist[currentIndex])}`;
    }

    playBtn.onclick = () => {
      if (currentIndex === -1) return;
      if (isPlaying) {
        send('pause');
        isPlaying = false;
        playBtn.textContent = '▶ Play';
        statusBar.textContent = 'Paused';
      } else {
        send('play');
        isPlaying = true;
        playBtn.textContent = '⏸ Pause';
        statusBar.textContent = 'Playing...';
      }
    };

    document.getElementById('prevBtn').onclick = () => load((currentIndex - 1 + playlist.length) % playlist.length);
    document.getElementById('nextBtn').onclick = () => load((currentIndex + 1) % playlist.length);
    document.getElementById('stopBtn').onclick = () => {
      send('stop');
      isPlaying = false;
      playBtn.textContent = '▶ Play';
      statusBar.textContent = 'Stopped';
    };

    // ════════════════════════════════════════════════════════════════
    // SCRUB BAR
    // ════════════════════════════════════════════════════════════════

    scrub.oninput = () => send('seek', scrub.value * duration / 100);

    // Listen for video time updates
    electronAPI.onVideoTime((currentTime, dur) => {
      duration = dur;
      if (!scrub.dragging) scrub.value = (currentTime / dur) * 100 || 0;
      timeLabel.textContent = fmt(currentTime) + ' / ' + fmt(dur);
    });

    function fmt(t) {
      if (isNaN(t)) return '00:00';
      const m = Math.floor(t / 60).toString().padStart(2, '0');
      const s = Math.floor(t % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // ════════════════════════════════════════════════════════════════
    // VOLUME CONTROL
    // ════════════════════════════════════════════════════════════════

    volSlider.oninput = () => send('setVolume', parseFloat(volSlider.value));

    // ════════════════════════════════════════════════════════════════
    // PREVIEW UPDATES
    // ════════════════════════════════════════════════════════════════

    electronAPI.onPreviewUpdate((data) => {
      if (!data || !data.role) return;

      const container = previewContainers[data.role];
      if (!container) return;

      if (data.imageData) {
        const img = document.createElement('img');
        img.src = data.imageData;
        img.style.maxWidth = '100%';
        img.style.maxHeight = '100%';
        container.image.innerHTML = '';
        container.image.appendChild(img);
      }

      // Update status based on role
      if (data.role === 'clock') {
        container.status.textContent = data.time || 'Connected';
      } else {
        const timeStr = data.currentTime ? `${fmt(data.currentTime)} / ${fmt(data.duration)}` : 'Ready';
        const status = data.isPaused ? `⏸ ${timeStr}` : `▶ ${timeStr}`;
        container.status.textContent = status;
      }
    });

    // ════════════════════════════════════════════════════════════════
    // DISPLAY MANAGEMENT
    // ════════════════════════════════════════════════════════════════

    function updateDisplayStatus(windowStatus) {
      if (!windowStatus) return;

      const parts = [];
      if (windowStatus.video)   parts.push(`${windowStatus.video} Video`);
      if (windowStatus.youtube) parts.push(`${windowStatus.youtube} YouTube`);
      if (windowStatus.web)     parts.push(`${windowStatus.web} Web`);
      if (windowStatus.clock)   parts.push(`${windowStatus.clock} Clock`);

      displayStatus.classList.remove('warning', 'error');
      if (parts.length === 0) {
        displayStatus.textContent = 'No screens active — use “Reconfigure Displays” to assign some.';
        displayStatus.classList.add('warning');
      } else {
        displayStatus.textContent = 'Active screens: ' + parts.join(', ');
      }
    }

    document.getElementById('reconfigBtn').onclick = () => {
      console.log('Reconfigure displays requested');
      electronAPI.reconfigureDisplays();
    };

    document.getElementById('identifyBtn').onclick = () => electronAPI.identifyScreens();
    document.getElementById('helpBtn').onclick = () => electronAPI.openHelp();

    // ════════════════════════════════════════════════════════════════
    // YOUTUBE / WEB CONTROLS
    // ════════════════════════════════════════════════════════════════

    const ytUrl = document.getElementById('ytUrl');
    const webUrl = document.getElementById('webUrl');

    function sendYouTube() {
      const url = ytUrl.value.trim();
      if (!url) return;
      electronAPI.sendYouTubeUrl(url);
      statusBar.textContent = `▶️ Sent to YouTube screen: ${url}`;
    }

    function sendWeb() {
      const url = webUrl.value.trim();
      if (!url) return;
      electronAPI.sendWebUrl(url);
      statusBar.textContent = `🌐 Opened on Web screen: ${url}`;
    }

    document.getElementById('ytPlayBtn').onclick = sendYouTube;
    document.getElementById('webOpenBtn').onclick = sendWeb;
    ytUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendYouTube(); });
    webUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendWeb(); });

    // Dim + disable sections whose display role isn't assigned to any screen,
    // so the controller only offers what the current setup can actually show.
    function applyRoleAvailability(cfg) {
      const roles = new Set((cfg.displays || []).map(d => d.role));

      const sections = {
        localvideo: roles.has('video'),
        youtube: roles.has('youtube'),
        web: roles.has('web'),
      };

      Object.entries(sections).forEach(([key, available]) => {
        const el = document.getElementById(`section-${key}`);
        if (el) el.classList.toggle('unavailable', !available);
      });

      const hint = 'No screen is assigned to this. Use “Reconfigure Displays” to add one.';
      document.getElementById('ytHint').textContent = sections.youtube ? '' : hint;
      document.getElementById('webHint').textContent = sections.web ? '' : hint;
    }

    // ════════════════════════════════════════════════════════════════
    // INTERACTIVE TUTORIAL (spotlight tour)
    // ════════════════════════════════════════════════════════════════

    const TOUR_STEPS = [
      { sel: '#preview-grid',        title: '👀 Live previews', text: 'Each active screen shows a small live thumbnail here, so you can monitor every display at a glance.' },
      { sel: '#section-localvideo',  title: '🎬 Local video', text: 'Add video files and control them here — Play/Pause, scrub, and Master Volume. The video plays on every screen set to “Video”.' },
      { sel: '#section-youtube',     title: '▶️ YouTube', text: 'Paste a YouTube link (or video ID) and press Enter to play it on your YouTube screen(s).' },
      { sel: '#section-web',         title: '🌐 Web page', text: 'Type any website address and press Enter to show it on your Web screen(s).' },
      { sel: '#identifyBtn',         title: '🔦 Identify screens', text: 'Not sure which physical screen is which? This flashes a big number on each one.' },
      { sel: '#reconfigBtn',         title: '⚙️ Reconfigure', text: 'Change which screen shows what at any time. That’s it — you’re ready to go!' },
    ];

    const tourBox = document.getElementById('tour-box');
    let tourIndex = 0;
    let tourTarget = null;

    function positionTourBox(target) {
      const r = target.getBoundingClientRect();
      const boxW = tourBox.offsetWidth, boxH = tourBox.offsetHeight;
      let top = r.bottom + 12;
      if (top + boxH > window.innerHeight - 8) top = Math.max(8, r.top - boxH - 12);
      let left = Math.min(Math.max(8, r.left), window.innerWidth - boxW - 8);
      tourBox.style.top = top + 'px';
      tourBox.style.left = left + 'px';
    }

    function showTourStep(i) {
      if (tourTarget) tourTarget.classList.remove('tour-highlight');
      tourIndex = i;
      const step = TOUR_STEPS[i];
      tourTarget = document.querySelector(step.sel);
      if (!tourTarget) { endTour(); return; }

      tourTarget.scrollIntoView({ block: 'center', behavior: 'smooth' });
      tourTarget.classList.add('tour-highlight');

      document.getElementById('tour-title').textContent = step.title;
      document.getElementById('tour-text').textContent = step.text;
      document.getElementById('tour-step').textContent = `${i + 1} / ${TOUR_STEPS.length}`;
      document.getElementById('tour-back').style.visibility = i === 0 ? 'hidden' : 'visible';
      document.getElementById('tour-next').textContent = i === TOUR_STEPS.length - 1 ? 'Finish' : 'Next';
      tourBox.classList.add('show');
      // Position after layout/scroll settles.
      setTimeout(() => positionTourBox(tourTarget), 250);
    }

    function startTour() { showTourStep(0); }

    function endTour() {
      if (tourTarget) tourTarget.classList.remove('tour-highlight');
      tourTarget = null;
      tourBox.classList.remove('show');
      try { localStorage.setItem('tutorialSeen', '1'); } catch (_) {}
    }

    document.getElementById('tour-next').onclick = () =>
      tourIndex >= TOUR_STEPS.length - 1 ? endTour() : showTourStep(tourIndex + 1);
    document.getElementById('tour-back').onclick = () => showTourStep(Math.max(0, tourIndex - 1));
    document.getElementById('tour-skip').onclick = endTour;
    document.getElementById('tutorialBtn').onclick = startTour;
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && tourBox.classList.contains('show')) endTour(); });
    window.addEventListener('resize', () => { if (tourTarget) positionTourBox(tourTarget); });

    // Auto-run once, the first time the controller opens.
    function maybeAutoTour() {
      let seen = false;
      try { seen = localStorage.getItem('tutorialSeen') === '1'; } catch (_) {}
      if (!seen) setTimeout(startTour, 700);
    }

    // ════════════════════════════════════════════════════════════════
    // STARTUP
    // ════════════════════════════════════════════════════════════════

    initialize();
    maybeAutoTour();
  </script>
</body>
</html>
