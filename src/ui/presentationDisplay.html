<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Presentation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    /* Both the PDF canvas and the image slide fit within the screen. */
    #slide-canvas, #slide-img {
      max-width: 100%; max-height: 100%; object-fit: contain; display: none;
    }
    /* Animated deck: LibreOffice's SVG presentation engine runs in an iframe. */
    #svg-frame {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; background: #000; display: none;
    }
    #message {
      color: #888; font-size: 22px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    /* Full-screen blackout toggled by the remote's "blank" command. */
    #blank-overlay { position: fixed; inset: 0; background: #000; display: none; z-index: 100; }
    #blank-overlay.on { display: block; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="slide-canvas"></canvas>
    <img id="slide-img" alt="">
    <div id="message">No presentation loaded — add one from the controller.</div>
  </div>
  <iframe id="svg-frame"></iframe>
  <div id="blank-overlay"></div>

  <!-- Vendored pdf.js (UMD build exposes window.pdfjsLib). -->
  <script src="../vendor/pdfjs/pdf.min.js"></script>
  <script>
    // electronAPI / nodeAPI are preload globals (contextBridge).
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = '../vendor/pdfjs/pdf.worker.min.js';
    }

    const canvasEl = document.getElementById('slide-canvas');
    const imgEl = document.getElementById('slide-img');
    const messageEl = document.getElementById('message');
    const frameEl = document.getElementById('svg-frame');

    let state = { type: 'pdf', source: '', svg: '', images: [], index: 0, count: 0 };
    let pdfDoc = null;
    let renderToken = 0; // guards against overlapping async renders
    let svgMode = false; // animated deck playing in the iframe engine

    function showOnly(el) {
      canvasEl.style.display = 'none';
      imgEl.style.display = 'none';
      messageEl.style.display = 'none';
      frameEl.style.display = 'none';
      if (el) el.style.display = 'block';
    }

    // ── Animated SVG mode: drive LibreOffice's embedded presentation engine
    //    the same way its own arrow-key bindings do. ──
    function svgWin() {
      try { return frameEl.contentWindow; } catch (_) { return null; }
    }
    function svgCall(fn) {
      const w = svgWin();
      if (!w || typeof w.dispatchEffects !== 'function') return false;
      try { fn(w); return true; } catch (err) { console.error('SVG engine call failed:', err); return false; }
    }
    function loadSvg(svgPath) {
      svgMode = true;
      frameEl.onload = () => {
        // Make the fixed-size SVG root fill the screen (viewBox handles scaling).
        svgCall((w) => {
          const root = w.document.documentElement;
          root.setAttribute('width', '100%');
          root.setAttribute('height', '100%');
        });
        // Restore the saved position (after a restart / reconfigure).
        if (state.index > 0) svgCall((w) => w.aSlideShow.displaySlide(state.index, true));
        reportIndex();
      };
      frameEl.src = electronAPI.toFileURL(svgPath);
      showOnly(frameEl);
    }

    // The engine owns the live index in svg mode (animations consume presses),
    // so poll it and report changes; pdf/images report from renderSlide.
    let lastReported = -1;
    function reportIndex() {
      if (svgMode) {
        svgCall((w) => {
          if (typeof w.nCurSlide === 'number') state.index = w.nCurSlide;
        });
      }
      if (state.index !== lastReported) {
        lastReported = state.index;
        electronAPI.sendPresentationIndex(state.index);
      }
    }
    setInterval(reportIndex, 500);

    async function loadSource(data) {
      state = { ...state, ...(data || {}) };
      // Free the previous deck — pdf.js keeps page/worker memory alive until
      // the document is explicitly destroyed.
      if (pdfDoc) { try { pdfDoc.destroy(); } catch (_) {} }
      pdfDoc = null;
      renderToken++;
      svgMode = false;
      frameEl.onload = null;
      lastReported = -1; // re-announce the index for the new source

      // Animated deck available → the SVG engine takes over rendering.
      if (state.svg && nodeAPI.fs.existsSync(state.svg)) {
        loadSvg(state.svg);
        return;
      }
      frameEl.src = 'about:blank';

      if (state.type === 'pdf' && state.source) {
        try {
          const bytes = nodeAPI.fs.readBytes(state.source);
          pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
          state.count = pdfDoc.numPages;
        } catch (err) {
          console.error('Failed to load PDF:', err);
          messageEl.textContent = 'Could not open this PDF.';
          showOnly(messageEl);
          return;
        }
      } else if (state.type === 'images') {
        state.count = (state.images || []).length;
      }

      state.index = Math.max(0, Math.min(state.index || 0, state.count - 1));
      renderSlide();
    }

    async function renderSlide() {
      if (!state.count) {
        messageEl.textContent = 'No presentation loaded — add one from the controller.';
        showOnly(messageEl);
        return;
      }
      const i = Math.max(0, Math.min(state.index, state.count - 1));
      state.index = i;

      if (state.type === 'images') {
        imgEl.src = electronAPI.toFileURL(state.images[i]);
        showOnly(imgEl);
        return;
      }

      if (!pdfDoc) return;
      const token = ++renderToken;
      try {
        const page = await pdfDoc.getPage(i + 1); // pdf.js pages are 1-based
        if (token !== renderToken) return; // a newer render superseded this one
        const unscaled = page.getViewport({ scale: 1 });
        const scale = Math.min(window.innerWidth / unscaled.width, window.innerHeight / unscaled.height);
        const viewport = page.getViewport({ scale: Math.max(0.1, scale) });
        canvasEl.width = Math.floor(viewport.width);
        canvasEl.height = Math.floor(viewport.height);
        const ctx = canvasEl.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;
        if (token !== renderToken) return;
        showOnly(canvasEl);
      } catch (err) {
        console.error('Failed to render page:', err);
      }
    }

    function goto(i) {
      if (svgMode) { svgCall((w) => w.aSlideShow.displaySlide(i, true)); reportIndex(); return; }
      state.index = i; renderSlide(); reportIndex();
    }
    function next() {
      if (svgMode) { svgCall((w) => w.dispatchEffects(1)); return; } // plays the next animation, or advances with its transition
      if (state.index < state.count - 1) goto(state.index + 1);
    }
    function prev() {
      if (svgMode) { svgCall((w) => w.aSlideShow.rewindEffect()); return; }
      if (state.index > 0) goto(state.index - 1);
    }

    // Blackout toggle (remote "blank" command). `on` may be boolean, else toggle.
    function setBlank(on) {
      const el = document.getElementById('blank-overlay');
      const show = on === undefined ? !el.classList.contains('on') : !!on;
      el.classList.toggle('on', show);
    }

    electronAPI.onPresentationLoad(loadSource);
    electronAPI.onPresentationCommand((cmd, data) => {
      if (cmd === 'goto' && typeof data === 'number') goto(data);
      else if (cmd === 'next') next();
      else if (cmd === 'prev') prev();
      else if (cmd === 'blank') setBlank(data);
    });

    // Re-fit the current slide if the window resizes (SVG scales itself).
    window.addEventListener('resize', () => { if (!svgMode && state.type === 'pdf') renderSlide(); });

    // Restore the last presentation on startup (after restart / reconfigure).
    electronAPI.getConfig()
      .then(cfg => { const p = cfg && cfg.presentation; if (p && (p.source || (p.images || []).length)) loadSource(p); })
      .catch(() => {});

    // Escape hatch so a single-screen user is never trapped behind the window.
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
    console.log('Presentation display initialized');
  </script>
</body>
</html>
