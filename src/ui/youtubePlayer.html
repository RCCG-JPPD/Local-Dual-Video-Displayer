<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Player Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #yt {
      width: 100%; height: 100%; border: none; display: inline-flex;
      transform-origin: center center; /* zoom scales about the middle */
    }
    #placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #888; font-family: 'Segoe UI', sans-serif; font-size: 22px;
    }
    #preview-canvas { display: none; position: absolute; top: -9999px; left: -9999px; }
  </style>
</head>
<body>
  <div id="placeholder">Waiting for a YouTube video…</div>
  <!-- A webview so we can script the <video> directly. Embed requests from a
       file:// app carry no Referer, which YouTube rejects ("Error 153") — the
       main process injects one (see setupYouTubeEmbedReferer in main.js). -->
  <webview id="yt" allowpopups></webview>
  <canvas id="preview-canvas"></canvas>

  <script>
    // electronAPI is a preload global (contextBridge) — don't redeclare it.
    const yt = document.getElementById('yt');
    const placeholder = document.getElementById('placeholder');
    const previewCanvas = document.getElementById('preview-canvas');
    let currentVideoId = '';
    let webviewReady = false;
    let ytZoom = 1; // scale multiplier; re-applied whenever the webview reloads

    /**
     * Zoom the YouTube screen. This is a <webview>, not a media element, so
     * object-fit doesn't apply and only the `scale` half of a zoom is meaningful
     * — we transform the whole embed. (webContents.setZoomFactor is no good here:
     * it re-lays-out the page, so YouTube just shrinks the video to fit.)
     * Scaling up crops the embed's letterbox/pillarbox bars, which is the point.
     */
    function applyZoom(zoom) {
      const z = electronAPI.zoom.normalize(zoom);
      ytZoom = z.scale;
      yt.style.transform = `scale(${ytZoom})`;
    }

    function loadYouTubeVideo(input, autoplay = true) {
      const id = electronAPI.extractYouTubeId(input);
      if (!id) { console.warn('Could not parse a YouTube video ID from:', input); return; }
      currentVideoId = id;
      placeholder.style.display = 'none';
      yt.style.display = 'inline-flex';
      // enablejsapi so the page exposes the player; we also script <video> directly.
      yt.src = `https://www.youtube.com/embed/${id}?autoplay=${autoplay ? 1 : 0}&controls=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1`;
    }

    yt.addEventListener('dom-ready', () => {
      webviewReady = true;
      yt.style.transform = `scale(${ytZoom})`; // re-assert after a navigation
    });

    electronAPI.onYouTubeUrlChange((url) => loadYouTubeVideo(url));

    // Drive the embedded player from the controller by scripting its <video>.
    function ytExec(js) {
      if (!webviewReady) return;
      yt.executeJavaScript(js).catch(() => {});
    }
    electronAPI.onYouTubeCommand((cmd, data) => {
      switch (cmd) {
        case 'play':  ytExec("var v=document.querySelector('video'); if(v) v.play();"); break;
        case 'pause': ytExec("var v=document.querySelector('video'); if(v) v.pause();"); break;
        case 'clear':
          currentVideoId = '';
          yt.src = 'about:blank';
          yt.style.display = 'none'; // about:blank paints white — keep the screen black
          placeholder.style.display = 'flex';
          break;
        case 'toggle': ytExec("var v=document.querySelector('video'); if(v){ v.paused? v.play() : v.pause(); }"); break;
        case 'setVolume': {
          const vol = Math.max(0, Math.min(1, Number(data) || 0));
          ytExec(`var v=document.querySelector('video'); if(v){ v.muted=false; v.volume=${vol}; }`);
          break;
        }
        case 'setZoom': applyZoom(data); break;
        case 'mute': ytExec(`var v=document.querySelector('video'); if(v) v.muted=${data ? 'true' : 'false'};`); break;
      }
    });

    // ── controller thumbnail (kept lightweight) ──
    function capturePreviewFrame() {
      try {
        previewCanvas.width = 320; previewCanvas.height = 180;
        const ctx = previewCanvas.getContext('2d');
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 320, 180);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
        ctx.fillText('YouTube', 160, 40);
        ctx.font = '14px Arial'; ctx.fillStyle = '#aaa';
        ctx.fillText(currentVideoId ? `Video: ${currentVideoId}` : 'Waiting for video…', 160, 160);
        electronAPI.sendPreviewData({ role: 'youtube', imageData: previewCanvas.toDataURL('image/jpeg', 0.7), videoId: currentVideoId });
      } catch (_) {}
    }
    setInterval(capturePreviewFrame, 1500);

    // Restore the last video on startup — lets a video be queued from the
    // controller before any screen is assigned to YouTube. Loaded PAUSED:
    // only an explicit "Load on YouTube screen" from the controller autoplays.
    electronAPI.getConfig()
      .then(cfg => {
        if (cfg && cfg.zoom) applyZoom(cfg.zoom.youtube);
        const y = cfg && cfg.youtube;
        if (y && y.url) loadYouTubeVideo(y.url, false);
      })
      .catch(() => {});

    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
    console.log('YouTube player ready');
  </script>
</body>
</html>
